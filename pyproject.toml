[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbelveder-py"
version = "0.1.0"
description = "Database backend for dbelveder.nvim"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
mssql = ["mssql-python>=1.8.0"]
neo4j = ["neo4j>=5.0"]
oracle = ["oracledb>=2.0"]
mongodb = ["pymongo>=4.0"]

[project.scripts]
dbelveder = "dbelveder.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["dbelveder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "external: requires a live external service (run from tests/external/)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]
