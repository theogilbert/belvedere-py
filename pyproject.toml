[project]
name = "grannos-py"
version = "0.1.0"
description = "Database backend for grannos.nvim"
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name="Theo Gilbert" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/theogilbert/grannos-py"

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
mssql = ["mssql-python>=1.8.0"]
neo4j = ["neo4j>=5.0"]
oracle = ["oracledb>=2.0"]
postgres = ["psycopg[binary]>=3.1"]
mongodb = ["pymongo>=4.0"]
elasticsearch = ["elasticsearch>=8.0,<9.0", "aiohttp>=3.0"]
prometheus = ["aiohttp>=3.0"]
s3 = ["boto3>=1.34", "pyyaml>=6.0"]
all = [
    "grannos-py[duckdb,mssql,neo4j,oracle,postgres,mongodb,elasticsearch,prometheus,s3]",
]

[project.scripts]
grannos = "grannos.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grannos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "external: requires a live external service (run from tests/external/)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]
